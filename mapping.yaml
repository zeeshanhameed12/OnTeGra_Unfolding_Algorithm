version: 1


# ============================================================
# Prefixes
# ============================================================

prefixes:

  traffic: "http://example.org/traffic#"

  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"

  xsd: "http://www.w3.org/2001/XMLSchema#"

  time: "http://www.w3.org/2006/time#"



# ============================================================
# Source queries
# ============================================================

sources:


  P1_Follows: 
    
    type: cypher

    query: |

        //------------------------ Follows(A,B) -------------------------
          // P1 – Following relation
          // Vehicle A follows vehicle B (same lane, B ahead)

          WITH
            100 AS stepSize

          MATCH (a_s1:object_state)-[:OF]->(a:object)
          WHERE a_s1.following IS NOT NULL
            AND a_s1.following <> 0
            AND a_s1.lane_id IS NOT NULL

          WITH a.id AS vehicle_id,
              a_s1.following AS following_vehicle_id,
              a_s1.lane_id AS lane,
              a_s1.timestamp AS timestamp,
              stepSize
          ORDER BY vehicle_id, following_vehicle_id, timestamp ASC

          WITH vehicle_id, following_vehicle_id, stepSize,
              collect(timestamp) AS timestamps,
              collect(lane) AS lanes

          // Build P1 intervals by scanning the ordered timestamps.
          WITH vehicle_id, following_vehicle_id, lanes, timestamps, stepSize,
            reduce(
              acc = {
                intervals: [],
                start: timestamps[0],
                prev: timestamps[0],
                lane: lanes[0],
                intervalTimestamps: [timestamps[0]],
                countStates: 1
              },  
              i IN range(1, size(timestamps) - 1) |
              CASE
                WHEN timestamps[i] = acc.prev + stepSize
                  AND lanes[i] = acc.lane
                THEN {
                  intervals: acc.intervals,
                  start: acc.start,
                  prev: timestamps[i],
                  lane: acc.lane,
                  intervalTimestamps: acc.intervalTimestamps + [timestamps[i]],
                  countStates: acc.countStates + 1
                }
                ELSE {
                  intervals: acc.intervals + [{
                    start: acc.start,
                    end: acc.prev,
                    lane: acc.lane,       
                    timestamps: acc.intervalTimestamps,     
                    lanes: acc.intervalLanes,
                    numberOfStates: acc.countStates
                  }],
                  start: timestamps[i],
                  prev: timestamps[i],
                  lane: lanes[i],
                  intervalTimestamps: [timestamps[i]],
                  countStates: 1
                }
              END
            ) AS result   

          // Append the final open P1 interval.
          WITH vehicle_id, following_vehicle_id, result.intervals + [{
            start: result.start,
            end: result.prev,
            lane: result.lane,
            timestamps: result.intervalTimestamps,      
            numberOfStates: result.countStates
          }] AS P1Intervals   

          UNWIND P1Intervals AS P1Interval
          RETURN vehicle_id, following_vehicle_id, 
              P1Interval.start AS P1_start, 
              P1Interval.end AS P1_end, 
              P1Interval.lane AS P1_lane, 
              //P1Interval.timestamps AS timestamps, 
              P1Interval.numberOfStates AS P1_numberOfStates

# source query for P2 - Small headway relation
# //   Headway < 1 s
#//      for ≥ 3 s
  P2-SmallHeadway:

    type: cypher

    query: |

      //P2 – Small headway

      //---------------------------------------------------------------------------
      // Parameters for interval construction.
      //---------------------------------------------------------------------------
      WITH
        3.0 AS headway_threshold, // Threshold for small headway in seconds
        500 AS min_duration, // Minimum duration for a valid scenario in milliseconds
        100 AS stepSize // Minimum duration between two consecutive states
      // ---------------------------------------------------------------------------
      // P2: Small headway relation
      // ---------------------------------------------------------------------------
      MATCH (s:object_state)-[:OF]->(v:object)
      WHERE s.space_headway IS NOT NULL
        AND s.space_headway > 0
        AND s.space_headway < headway_threshold
        AND s.lane_id IS NOT NULL

      WITH min_duration, stepSize,
          v.id AS vehicle,
          s.lane_id AS lane_id,
          s.following AS following_vehicle,
          s.space_headway AS space_headway,
          s.timestamp AS timestamps
      ORDER BY vehicle, timestamps
      WITH
          vehicle,min_duration, stepSize,
          collect(lane_id) AS lanes,
          collect(following_vehicle) AS following_vehicles,
          collect(space_headway) AS gaps,
          collect(timestamps) AS timestamps
      // Building P2 intervals by scanning the ordered timestamps and checking for consecutive states with the same lane and following vehicle.
      WITH vehicle, lanes,following_vehicles,gaps,timestamps, min_duration, stepSize,
          // Initialize the accumulator for the reduce function.
          reduce(
          acc = {
            intervals: [],
            start: timestamps[0],
            prev: timestamps[0],
            lane: lanes[0],
            follower: following_vehicles[0],
            intervalTimestamps: [timestamps[0]],
            intervalSpaceHeadways: [gaps[0]],
            countStates: 1
          },
          // Iterate over the timestamps starting from the second one.
          i IN range(1, size(timestamps) - 1) |
          CASE // Check if the current state is consecutive to the previous one and has the same lane and leading vehicle.
            WHEN timestamps[i] = acc.prev + stepSize
              AND lanes[i] = acc.lane
              AND following_vehicles[i] = acc.follower
            THEN { 
              intervals: acc.intervals,
              start: acc.start,
              prev: timestamps[i],
              lane: acc.lane,
              follower: acc.follower,
              intervalTimestamps: acc.intervalTimestamps + [timestamps[i]],
              intervalSpaceHeadways: acc.intervalSpaceHeadways + [gaps[i]],
              countStates: acc.countStates + 1
            }
            ELSE { // If not consecutive or different lane/leader, close the previous interval and start a new one.
              intervals: acc.intervals + [{
                start: acc.start,
                end: acc.prev,
                lane: acc.lane,
                follower: acc.follower,
                timestamps: acc.intervalTimestamps,
                spaceHeadways: acc.intervalSpaceHeadways,
                numberOfStates: acc.countStates
              }], // Close the previous interval.
              start: timestamps[i],
              prev: timestamps[i],
              lane: lanes[i],
              follower: following_vehicles[i],
              intervalTimestamps: [timestamps[i]],
              intervalSpaceHeadways: [gaps[i]],
              countStates: 1
            }
          END
        ) AS result
      // Append the final open interval after processing all timestamps.
      WITH
        vehicle,
        result.intervals + [{
          start: result.start,
          end: result.prev,
          lane: result.lane,
          follower: result.follower,
          timestamps: result.intervalTimestamps,
          spaceHeadways: result.intervalSpaceHeadways,
          numberOfStates: result.countStates
        }] AS gapIntervals,
        min_duration,
        stepSize

      UNWIND gapIntervals AS gapInterval

      RETURN
        vehicle AS vehicle_id, 
        gapInterval.follower AS following_vehicle_id,
        gapInterval.start AS P2_start,
        gapInterval.end AS P2_end,
        gapInterval.lane AS lane,
        //gapInterval.timestamps AS timestamps, 
        //gapInterval.spaceHeadways AS space_headways, 
        gapInterval.numberOfStates AS number_of_states


# P1 and P2
  Tailgate:

    type: cypher

    query: |

      // Scenario 7 - Close Following (Tailgating)
      //
      // P1: following relation
      // P2: small headway
      // Allen relation: P2 during P1

      WITH
        100 AS stepSize,
        3.0 AS headway_threshold,
        500 AS min_duration


      // -------------------------------------------------------
      // P1: Following relation
      // -------------------------------------------------------

      MATCH (a_s1:object_state)-[:OF]->(a:object)

      WHERE a_s1.following IS NOT NULL
        AND a_s1.following <> 0
        AND a_s1.lane_id IS NOT NULL


      WITH
        a.id AS vehicle_id,
        a_s1.following AS following_vehicle_id,
        a_s1.lane_id AS lane,
        a_s1.timestamp AS timestamp,
        headway_threshold,
        min_duration,
        stepSize

      ORDER BY
        vehicle_id,
        following_vehicle_id,
        timestamp ASC


      WITH
        vehicle_id,
        following_vehicle_id,
        headway_threshold,
        min_duration,
        stepSize,
        collect(timestamp) AS timestamps,
        collect(lane) AS lanes


      WITH
        vehicle_id,
        following_vehicle_id,
        headway_threshold,
        min_duration,
        stepSize,

        reduce(

          acc = {

            intervals: [],

            start: timestamps[0],

            prev: timestamps[0],

            lane: lanes[0],

            intervalTimestamps: [timestamps[0]],

            countStates: 1

          },

          i IN range(1, size(timestamps) - 1) |

          CASE

            WHEN timestamps[i] = acc.prev + stepSize
              AND lanes[i] = acc.lane

            THEN {

              intervals:
                acc.intervals,

              start:
                acc.start,

              prev:
                timestamps[i],

              lane:
                acc.lane,

              intervalTimestamps:
                acc.intervalTimestamps + [timestamps[i]],

              countStates:
                acc.countStates + 1

            }

            ELSE {

              intervals:
                acc.intervals + [{

                  start:
                    acc.start,

                  end:
                    acc.prev,

                  lane:
                    acc.lane,

                  timestamps:
                    acc.intervalTimestamps,

                  numberOfStates:
                    acc.countStates

                }],

              start:
                timestamps[i],

              prev:
                timestamps[i],

              lane:
                lanes[i],

              intervalTimestamps:
                [timestamps[i]],

              countStates:
                1

            }

          END

        ) AS result


      WITH
        vehicle_id,
        following_vehicle_id,
        headway_threshold,
        min_duration,
        stepSize,

        result.intervals + [{

          start:
            result.start,

          end:
            result.prev,

          lane:
            result.lane,

          timestamps:
            result.intervalTimestamps,

          numberOfStates:
            result.countStates

        }] AS P1Intervals



      // -------------------------------------------------------
      // P2: Small headway relation
      // -------------------------------------------------------

      MATCH (s:object_state)-[:OF]->(v:object)

      WHERE v.id = vehicle_id
        AND s.following = following_vehicle_id
        AND s.space_headway IS NOT NULL
        AND s.space_headway > 0
        AND s.space_headway < headway_threshold
        AND s.lane_id IS NOT NULL


      WITH
        vehicle_id,
        following_vehicle_id,
        P1Intervals,
        s.lane_id AS lane,
        s.space_headway AS space_headway,
        s.timestamp AS timestamp,
        min_duration,
        stepSize

      ORDER BY
        vehicle_id,
        timestamp ASC


      WITH
        vehicle_id,
        following_vehicle_id,
        P1Intervals,
        min_duration,
        stepSize,
        collect(lane) AS lanes,
        collect(space_headway) AS gaps,
        collect(timestamp) AS timestamps


      WITH
        vehicle_id,
        following_vehicle_id,
        P1Intervals,
        min_duration,

        reduce(

          acc = {

            intervals: [],

            start:
              timestamps[0],

            prev:
              timestamps[0],

            lane:
              lanes[0],

            intervalTimestamps:
              [timestamps[0]],

            intervalSpaceHeadways:
              [gaps[0]],

            countStates:
              1

          },

          i IN range(1, size(timestamps) - 1) |

          CASE

            WHEN timestamps[i] = acc.prev + stepSize
              AND lanes[i] = acc.lane

            THEN {

              intervals:
                acc.intervals,

              start:
                acc.start,

              prev:
                timestamps[i],

              lane:
                acc.lane,

              intervalTimestamps:
                acc.intervalTimestamps + [timestamps[i]],

              intervalSpaceHeadways:
                acc.intervalSpaceHeadways + [gaps[i]],

              countStates:
                acc.countStates + 1

            }

            ELSE {

              intervals:
                acc.intervals + [{

                  start:
                    acc.start,

                  end:
                    acc.prev,

                  lane:
                    acc.lane,

                  timestamps:
                    acc.intervalTimestamps,

                  spaceHeadways:
                    acc.intervalSpaceHeadways,

                  numberOfStates:
                    acc.countStates

                }],

              start:
                timestamps[i],

              prev:
                timestamps[i],

              lane:
                lanes[i],

              intervalTimestamps:
                [timestamps[i]],

              intervalSpaceHeadways:
                [gaps[i]],

              countStates:
                1

            }

          END

        ) AS result


      WITH
        vehicle_id,
        following_vehicle_id,
        P1Intervals,
        min_duration,

        result.intervals + [{

          start:
            result.start,

          end:
            result.prev,

          lane:
            result.lane,

          timestamps:
            result.intervalTimestamps,

          spaceHeadways:
            result.intervalSpaceHeadways,

          numberOfStates:
            result.countStates

        }] AS P2Intervals


      // -------------------------------------------------------
      // Scenario 7:
      // duration condition + strict P2 during P1
      // -------------------------------------------------------

      UNWIND P2Intervals AS p2

      UNWIND P1Intervals AS p1


      WITH
        vehicle_id,
        following_vehicle_id,
        p1,
        p2,
        p2.end - p2.start AS observedDurationMs,
        min_duration


      WHERE observedDurationMs > min_duration
        AND p2.start > p1.start
        AND p2.end < p1.end


      RETURN
        vehicle_id,
        following_vehicle_id,

        p1.start AS P1_start,
        p1.end AS P1_end,

        p2.start AS P2_start,
        p2.end AS P2_end,

        p2.start AS Scenario7_start,
        p2.end AS Scenario7_end

      ORDER BY
        vehicle_id,
        following_vehicle_id,
        Scenario7_start



# ============================================================
# Mapping assertions
# ============================================================

mappings:

  # ==========================================================
  # M1 - P1: follows
  # ==========================================================

  - mappingId: M-Follows

    source: P1_Follows


    target:

      subject:
        "traffic:vehicle_{{vehicle_id}}"

      predicate:
        "traffic:follows"

      object:
        "traffic:vehicle_{{following_vehicle_id}}"
      
      interval:

        start:
          "{{P1_start}}"

        end:
          "{{P1_end}}"

  # ==========================================================
  # M2 - P2: small headway
  # ==========================================================

  - mappingId: M-SmallHeadway

    source: P2-SmallHeadway

    target:

      subject:
        "traffic:vehicle_{{vehicle_id}}"

      predicate:
        "traffic:small_headway"

      object:
        "traffic:vehicle_{{following_vehicle_id}}"
      interval:

        start:
          "{{P2_start}}"

        end:
          "{{P2_end}}"

  # ==========================================================
  # M2 - Tailgates
  # ==========================================================
  
  - mappingId: M-Tailgate

    source: Tailgate

    target:

      subject:
        "traffic:vehicle_{{vehicle_id}}"

      predicate:
        "traffic:tailgates"

      object:
        "traffic:vehicle_{{following_vehicle_id}}"

      interval:

        start:
          "{{Scenario7_start}}"

        end:
          "{{Scenario7_end}}"

  

